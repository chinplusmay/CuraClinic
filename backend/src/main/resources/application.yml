server:
  port: ${PORT:8080}

spring:
  application:
    name: clinicflow-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clinicflow}?useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=LOCAL}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Email delivery is optional in development. When no SMTP host is configured the
  # notification gateway records the message and logs it instead of sending.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

clinicflow:
  jwt:
    secret: ${JWT_SECRET:clinicflow-development-signing-key-change-me-before-production}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  reminders:
    poll-ms: 30000
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    com.clinicflow: INFO
    org.hibernate.SQL: WARN
